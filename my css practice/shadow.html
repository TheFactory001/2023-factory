<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .card img {
        width: 100%;
      }

      .card {
        width: 400px;
        margin: 100px auto;
        background-color: #ccc;
        padding: 5px;
        text-align: center;
        box-shadow: 5px 5px 10px #777;
      }

      .card:hover {
        box-shadow: 10px 10px 20px #aaa;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="img/background 4.jpg" alt="" />
      <h2>My card</h2>
    </div>
  </body>
</html>
